services:
  wlt:
    build:
      context: .
      dockerfile: Dockerfile
    image: wlt:latest
    container_name: wlt
    restart: unless-stopped
    ports:
      - "${WLT_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      NITRO_HOST: "0.0.0.0"
      PORT: "8080"
      NITRO_PORT: "8080"
      VITE_AUTH_ENABLED: "false"
      # Optional: Postgres. Leave unset to use the embedded PGLite store.
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - wlt-data:/app/data

volumes:
  wlt-data:
